name: Build Note8 Kernel (ReSukiSU + SUSFS)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

jobs:
  build:
    name: SM-N950F · ReSukiSU · SUSFS · Note 8
    runs-on: ubuntu-latest

    steps:
    # ── 1. Checkout ────────────────────────────────────────────────────────────
    - name: Checkout
      uses: actions/checkout@v4

    # ── 2. Dependencies ────────────────────────────────────────────────────────
    - name: Install Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          bc bison flex libssl-dev libelf-dev \
          python3 git patch coreutils curl \
          build-essential cpio wget zip \
          libc6-i386 lib32stdc++6 lib32z1

    # ── 3. Clone Kernel Source ─────────────────────────────────────────────────
    - name: Clone Kernel Source
      run: |
        git clone --depth=1 https://github.com/ace2nutzer/Samsung_dreamlte_Kernel \
          kernel_source

    # ── 4. Download Toolchain ──────────────────────────────────────────────────
    - name: Download Toolchain
      run: |
        wget -q https://developer.arm.com/-/media/Files/downloads/gnu-a/8.3-2019.03/binrel/gcc-arm-8.3-2019.03-x86_64-aarch64-linux-gnu.tar.xz
        tar -xf gcc-arm-8.3-2019.03-x86_64-aarch64-linux-gnu.tar.xz
        rm gcc-arm-8.3-2019.03-x86_64-aarch64-linux-gnu.tar.xz
        echo "✅ ARM GCC 8.3 toolchain ready"

    # ── 5. Environment Variables ───────────────────────────────────────────────
    - name: Set Environment Variables
      run: |
        TC=$GITHUB_WORKSPACE/gcc-arm-8.3-2019.03-x86_64-aarch64-linux-gnu/bin
        echo "KROOT=$GITHUB_WORKSPACE/kernel_source"  >> $GITHUB_ENV
        echo "CROSS_COMPILE=$TC/aarch64-linux-gnu-"   >> $GITHUB_ENV
        echo "PATCHES=$GITHUB_WORKSPACE/patches"      >> $GITHUB_ENV

    # ── 6. Setup ReSukiSU ──────────────────────────────────────────────────────
    - name: Setup ReSukiSU
      working-directory: kernel_source
      run: |
        curl -LSs \
          "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
          | bash -s d80dbca8a01a428cd13aa126ced2ff02c546813b || true
        FAIL=0
        grep -q "config KSU" drivers/kernelsu/Kconfig \
          && echo "✅ Kconfig has KSU" || { echo "❌ Kconfig missing KSU"; FAIL=1; }
        grep -q "kernelsu" drivers/Makefile \
          && echo "✅ Makefile wired"  || { echo "❌ Makefile not wired";  FAIL=1; }
        [ -d drivers/kernelsu ] \
          && echo "✅ driver dir exists" || { echo "❌ driver dir missing"; FAIL=1; }
        if [ "$FAIL" -ne 0 ]; then
          echo "❌ ReSukiSU setup failed"
          exit 1
        fi

    # ── 7. Patch Kconfig: drop THREAD_INFO_IN_TASK dependency from KSU_SUSFS ────
    # CRITICAL: do NOT force CONFIG_THREAD_INFO_IN_TASK=y anywhere in this
    # workflow. That symbol is unsatisfiable on Samsung 4.4's real ABI
    # (current_thread_info() still reads sp_el0, task_struct layout is
    # native). Forcing it desyncs thread_info storage from task_struct and
    # silently corrupts manager-detection while still compiling/booting.
    # SUSFS's own source has zero references to thread_info, so the
    # dependency is just an inherited upstream GKI assumption — safe to drop.
    - name: Patch Kconfig (remove THREAD_INFO_IN_TASK dependency)
      working-directory: kernel_source
      run: |
        sed -i \
          -e 's/depends on THREAD_INFO_IN_TASK && 64BIT/depends on 64BIT/' \
          -e '/depends on THREAD_INFO_IN_TASK$/d' \
          drivers/kernelsu/Kconfig
        grep -B2 -A1 "KernelSU addon - SUSFS\|config KSU_SUSFS$" drivers/kernelsu/Kconfig

    # ── 8. Apply ReSukiSU 4.4 Compat Fixes ────────────────────────────────────
    - name: Apply ReSukiSU 4.4 Compat Fixes
      working-directory: kernel_source
      run: python3 ${{ env.PATCHES }}/sukisu_compat_fix.py

    # ── 9. Apply Manual KSU Hooks (only the ones still required by ────────────
    #       inline_hook_check.mk's literal string checks: execveat, faccessat,
    #       stat, reboot, sys_read, input_handle_event, setresuid. NOTE: these
    #       are presence-only checks unrelated to CONFIG_KSU_MANUAL_HOOK_AUTO_*
    #       — those auto-hook flags must NOT be set in defconfig (see step 12),
    #       since they silently neuter the real hook bodies in SUSFS mode.
    - name: Apply Manual KSU Hooks
      working-directory: kernel_source
      run: python3 ${{ env.PATCHES }}/manual_hooks.py

    # ── 10. Download and apply SUSFS v2.1.0 patch (4.9-targeted, fuzz=0) ──────
    - name: Apply SUSFS Patch
      working-directory: kernel_source
      run: |
        curl -LSs -o /tmp/susfs_4.9.patch \
          "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/Patch/susfs_patch_to_4.9.patch"
        patch -p1 --fuzz=0 < /tmp/susfs_4.9.patch || true
        echo "✅ SUSFS base patch applied (expected: many hunks fail — fixed by hunk-fix script below)"

    # ── 11. SUSFS Hunk Fixups ──────────────────────────────────────────────────
    - name: Apply SUSFS Hunk Fixes
      working-directory: kernel_source
      run: python3 ${{ env.PATCHES }}/susfs_hunk_fix_note8.py

    # ── 12. Kernel Config ──────────────────────────────────────────────────────
    # CONFIG_KSU_MANUAL_HOOK is intentionally OMITTED: it's in the same
    # Kconfig `choice` block as CONFIG_KSU_SUSFS (KernelSU Hooking Method),
    # so selecting SUSFS silently unselects MANUAL_HOOK regardless of what
    # we write here. The three CONFIG_KSU_MANUAL_HOOK_AUTO_* flags must also
    # be OMITTED — they gate dummy/no-op branches inside ksu_handle_setresuid,
    # ksu_handle_sys_read, and ksu_handle_input_handle_event that short-circuit
    # the real umount/grant logic when set, even though MANUAL_HOOK itself
    # isn't active. Setting them broke new root grants and mount-based
    # SUSFS hiding while leaving pre-existing grants (made under the old
    # RekiSU-only kernel) untouched.
    - name: Set Kernel Config
      working-directory: kernel_source
      run: |
        cat >> arch/arm64/configs/n950x_defconfig << 'EOF'
        CONFIG_KSU=y
        CONFIG_KSU_SUSFS=y
        CONFIG_KSU_SUSFS_SUS_PATH=y
        CONFIG_KSU_SUSFS_SUS_MOUNT=y
        CONFIG_KSU_SUSFS_SUS_KSTAT=y
        CONFIG_KSU_SUSFS_SPOOF_UNAME=y
        CONFIG_KSU_SUSFS_ENABLE_LOG=y
        CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
        CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
        CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
        CONFIG_KSU_SUSFS_SUS_MAP=y
        CONFIG_KALLSYMS_ALL=y
        CONFIG_UH=n
        CONFIG_UH_RKP=n
        CONFIG_UH_LKMAUTH=n
        CONFIG_UH_LKM_BLOCK=n
        CONFIG_RKP_CFP_JOPP=n
        CONFIG_RKP_CFP=n
        CONFIG_SECURITY_DEFEX=n
        CONFIG_PROCA=n
        CONFIG_FIVE=n
        CONFIG_RKP=n
        CONFIG_KDP_NS=n
        CONFIG_KDP=n
        EOF
        echo "✅ n950x_defconfig updated (NOTE: CONFIG_THREAD_INFO_IN_TASK and"
        echo "    CONFIG_KSU_MANUAL_HOOK* intentionally absent)"

    # ── 13. Build ──────────────────────────────────────────────────────────────
    - name: Build Kernel
      working-directory: kernel_source
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=${{ env.CROSS_COMPILE }}
        ARCH=arm64 scripts/kconfig/merge_config.sh \
          arch/arm64/configs/g950x_defconfig \
          arch/arm64/configs/n950x_defconfig
        grep "CONFIG_KSU=y" .config \
          && echo "✅ CONFIG_KSU=y in final config" \
          || echo "⚠️  CONFIG_KSU not in final config"
        grep "CONFIG_KSU_SUSFS=y" .config \
          && echo "✅ CONFIG_KSU_SUSFS=y in final config" \
          || echo "⚠️  CONFIG_KSU_SUSFS not in final config"
        grep "CONFIG_KSU_MANUAL_HOOK" .config \
          && echo "❌ WARNING: CONFIG_KSU_MANUAL_HOOK* present — this should NOT happen" \
          || echo "✅ CONFIG_KSU_MANUAL_HOOK* correctly absent"
        grep "CONFIG_THREAD_INFO_IN_TASK" .config \
          && echo "❌ WARNING: THREAD_INFO_IN_TASK is set — this should NOT happen" \
          || echo "✅ THREAD_INFO_IN_TASK correctly absent"
        make -j$(nproc) ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE 2>&1 | tee build.log || true

    # ── 14. Grab Image ─────────────────────────────────────────────────────────
    - name: Grab Kernel Image
      if: always()
      id: package
      run: |
        IMAGE="kernel_source/arch/arm64/boot/Image"
        if [ -f "$IMAGE" ]; then
          echo "✅ Image: $(du -h $IMAGE | cut -f1)"
          echo "image=$IMAGE"      >> $GITHUB_OUTPUT
          echo "image_found=true"  >> $GITHUB_OUTPUT
        else
          echo "❌ Image not found — check build.log artifact"
          echo "image_found=false" >> $GITHUB_OUTPUT
        fi

    - name: Upload to GoFile
      if: always() && steps.package.outputs.image_found == 'true'
      run: |
        SERVER=$(curl -s https://api.gofile.io/servers | \
          python3 -c "import sys,json; d=json.load(sys.stdin); \
                      print(d['data']['servers'][0]['name'])")
        RESP=$(curl -s \
          -F "file=@${{ steps.package.outputs.image }}" \
          "https://$SERVER.gofile.io/uploadFile")
        echo "✅ Image → $(echo $RESP | python3 -c \
          "import sys,json; d=json.load(sys.stdin); \
           print(d['data']['downloadPage'])")"

    - name: Upload Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Note8-ReSukiSU-SUSFS
        path: |
          ${{ steps.package.outputs.image }}
          kernel_source/build.log
        if-no-files-found: ignore
        compression-level: 0

    # ── 15. Surface Build Errors ───────────────────────────────────────────────
    - name: Surface Build Errors
      if: always()
      run: |
        if [ ! -f kernel_source/build.log ]; then
          echo "No build log found"
          exit 0
        fi
        echo "=== SUSFS/KSU driver errors ==="
        grep -n "susfs\|kernelsu\|drivers/kernelsu" kernel_source/build.log \
          | grep "error:" | head -40 || true
        echo ""
        echo "=== All errors ==="
        ERRORS=$(grep -c "error:" kernel_source/build.log 2>/dev/null || echo 0)
        echo "$ERRORS error(s) found"
        grep "error:" kernel_source/build.log | head -80 || true
        echo ""
        echo "=== First 15 warnings ==="
        grep "warning:" kernel_source/build.log | head -15 || true
