name: Build Note8 Kernel (ReSukiSU + SUSFS)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

jobs:
  build:
    name: SM-N950F · ReSukiSU + SUSFS · Note 8
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          bc bison flex libssl-dev libelf-dev \
          python3 git patch coreutils curl \
          build-essential cpio wget zip \
          libc6-i386 lib32stdc++6 lib32z1

    - name: Clone Kernel Source
      run: |
        git clone --depth=1 https://github.com/ace2nutzer/Samsung_dreamlte_Kernel kernel_source

    - name: Download Toolchain
      run: |
        wget -q https://developer.arm.com/-/media/Files/downloads/gnu-a/8.3-2019.03/binrel/gcc-arm-8.3-2019.03-x86_64-aarch64-linux-gnu.tar.xz
        tar -xf gcc-arm-8.3-2019.03-x86_64-aarch64-linux-gnu.tar.xz
        rm gcc-arm-8.3-2019.03-x86_64-aarch64-linux-gnu.tar.xz

    - name: Set Environment Variables
      run: |
        TC=$GITHUB_WORKSPACE/gcc-arm-8.3-2019.03-x86_64-aarch64-linux-gnu/bin
        echo "KROOT=$GITHUB_WORKSPACE/kernel_source"  >> $GITHUB_ENV
        echo "CROSS_COMPILE=$TC/aarch64-linux-gnu-"   >> $GITHUB_ENV
        echo "PATCHES=$GITHUB_WORKSPACE/patches"      >> $GITHUB_ENV

    - name: Setup ReSukiSU
      working-directory: kernel_source
      run: |
        curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main || true
        # Bypass static export check that was stopping the build
        rm -f KernelSU/kernel/tools/static_export_check.mk
        sed -i 's/default KSU_TRACEPOINT_HOOK/default KSU_SUSFS/' drivers/kernelsu/Kconfig
        sed -i '/depends on THREAD_INFO_IN_TASK/d' drivers/kernelsu/Kconfig

    - name: Apply ReSukiSU 4.4 Compat Fixes
      working-directory: kernel_source
      run: python3 ${{ env.PATCHES }}/sukisu_compat_fix.py

    - name: Apply Manual KSU Hooks
      working-directory: kernel_source
      run: python3 ${{ env.PATCHES }}/manual_hooks.py

    - name: Apply SUSFS Patches
      working-directory: kernel_source
      run: |
        SUSFS_BASE="https://gitlab.com/simonpunk/susfs4ksu/-/raw/kernel-4.9/kernel_patches"
        wget -q "$SUSFS_BASE/50_add_susfs_in_kernel-4.9.patch" -O susfs.patch
        wget -q "$SUSFS_BASE/fs/susfs.c" -O fs/susfs.c
        wget -q "$SUSFS_BASE/include/linux/susfs.h" -O include/linux/susfs.h
        wget -q "$SUSFS_BASE/include/linux/susfs_def.h" -O include/linux/susfs_def.h
        sed -i 's/linux\/bits.h/linux\/bitops.h/g' include/linux/susfs_def.h
        patch -p1 < susfs.patch || true

    - name: Apply SUSFS 4.4 Linker Fixups
      working-directory: kernel_source
      run: |
        python3 ${{ env.PATCHES }}/susfs_hunk_fix_note8.py
        git checkout fs/namei.c fs/notify/fdinfo.c fs/dcache.c fs/readdir.c || true
        sed -i 's/obj-y += ksu.o/obj-y += ksu.o susfs.o/' drivers/kernelsu/Makefile
        python3 -c '
        import os
        p1 = "drivers/kernelsu/supercall/dispatch.c"
        if os.path.exists(p1):
            with open(p1, "r") as f: c = f.read()
            s = "#include <linux/types.h>\n#define CMD_SUSFS_HIDE_SUS_MNTS_FOR_NON_SU_PROCS 0x5555555C\n#define CMD_SUSFS_ADD_SUS_MAP 0x5555555D\n#define CMD_SUSFS_ENABLE_AVC_LOG_SPOOFING 0x5555555E\n#define CMD_SUSFS_ADD_SUS_PATH 0x5555555F\nstatic inline int susfs_add_sus_map(unsigned long arg) { return 0; }\nstatic inline int susfs_hide_sus_mnts_for_non_su_procs(unsigned long arg) { return 0; }\nstatic inline int susfs_enable_avc_log_spoofing(unsigned long arg) { return 0; }\nstatic int susfs_is_avc_log_spoofing_enabled = 0;\n"
            with open(p1, "w") as f: f.write(s + c)
        p2 = "drivers/kernelsu/supercall/supercall.c"
        if os.path.exists(p2):
            with open(p2, "r") as f: c = f.read()
            s2 = "#ifndef SUSFS_MAGIC\n#define SUSFS_MAGIC 0xFAFAFAFA\n#endif\n"
            with open(p2, "w") as f: f.write(s2 + c)
        '
        sed -i '$a extern void susfs_extra_works(void);\nextern int susfs_is_current_proc_umounted(void);\nextern void susfs_set_current_proc_umounted(bool umounted);\nextern void susfs_start_sdcard_monitor_fn(void);\nextern int susfs_get_enabled_features(void);\nextern void susfs_set_avc_log_spoofing(bool enabled);\nextern void susfs_enable_log(bool enabled);\nextern void susfs_show_variant(void);\nextern void susfs_show_version(void);\nextern void susfs_set_hide_sus_mnts_for_non_su_procs(bool enabled);' include/linux/susfs.h

    - name: Build Kernel
      working-directory: kernel_source
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=${{ env.CROSS_COMPILE }}
        make ARCH=arm64 g950x_defconfig
        make -j$(nproc) ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE 2>&1 | tee build.log || true

    - name: Upload Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Note8-ReSukiSU-SUSFS
        path: |
          kernel_source/arch/arm64/boot/Image
          kernel_source/build.log
