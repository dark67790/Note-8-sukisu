name: Build Note8 Kernel (SukiSU-Ultra)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

jobs:
  build:
    name: SM-N950F · SukiSU-Ultra · Note 8
    runs-on: ubuntu-latest

    steps:
    # ── 1. Checkout ────────────────────────────────────────────────────────────
    - name: Checkout
      uses: actions/checkout@v4

    # ── 2. Dependencies ────────────────────────────────────────────────────────
    - name: Install Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          bc bison flex libssl-dev libelf-dev \
          python3 git patch coreutils curl \
          build-essential cpio wget zip \
          libc6-i386 lib32stdc++6 lib32z1

    # ── 3. Clone Kernel Source ─────────────────────────────────────────────────
    - name: Clone Kernel Source
      run: |
        git clone --depth=1 https://github.com/ace2nutzer/samsung_8895_kernel \
          kernel_source

    # ── 3.5 Download Toolchain ─────────────────────────────────────────────────
    - name: Download Toolchain
      run: |
        wget -q https://developer.arm.com/-/media/Files/downloads/gnu-a/8.3-2019.03/binrel/gcc-arm-8.3-2019.03-x86_64-aarch64-linux-gnu.tar.xz
        tar -xf gcc-arm-8.3-2019.03-x86_64-aarch64-linux-gnu.tar.xz
        rm gcc-arm-8.3-2019.03-x86_64-aarch64-linux-gnu.tar.xz
        echo "✅ ARM GCC 8.3 toolchain ready"

    # ── 4. Environment Variables ───────────────────────────────────────────────
    - name: Set Environment Variables
      run: |
        TC=$GITHUB_WORKSPACE/gcc-arm-8.3-2019.03-x86_64-aarch64-linux-gnu/bin
        echo "KROOT=$GITHUB_WORKSPACE/kernel_source"  >> $GITHUB_ENV
        echo "CROSS_COMPILE=$TC/aarch64-linux-gnu-"   >> $GITHUB_ENV
        echo "PATCHES=$GITHUB_WORKSPACE/patches"      >> $GITHUB_ENV

    # ── 5. Setup SukiSU-Ultra ──────────────────────────────────────────────────
    - name: Setup SukiSU-Ultra
      working-directory: kernel_source
      run: |
        curl -LSs \
          "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
          | bash -s main || true

        FAIL=0
        grep -q "config KSU\|KSU_SUSFS" drivers/kernelsu/Kconfig \
          && echo "✅ Kconfig has KSU" || { echo "❌ Kconfig missing KSU"; FAIL=1; }
        grep -q "kernelsu" drivers/Makefile \
          && echo "✅ Makefile wired"  || { echo "❌ Makefile not wired";  FAIL=1; }
        grep -q "kernelsu" drivers/Kconfig \
          && echo "✅ Kconfig sourced" || { echo "❌ Kconfig not sourced"; FAIL=1; }
        [ -d drivers/kernelsu ] \
          && echo "✅ driver dir exists" || { echo "❌ driver dir missing"; FAIL=1; }
        if [ "$FAIL" -ne 0 ]; then
          echo "❌ SukiSU setup failed"
          exit 1
        fi

    # ── 6. Fix Kconfig for non-GKI 4.4 ────────────────────────────────────────
    - name: Patch Kconfig KPROBES dependency
      working-directory: kernel_source
      run: |
        sed -i 's/depends on KPROBES && EXT4_FS/depends on EXT4_FS/' \
          drivers/kernelsu/Kconfig
        grep "depends on" drivers/kernelsu/Kconfig | head -3
        echo "✅ KPROBES dependency removed"

    # ── 6.5 Apply SukiSU 4.4 Compat Fixes ──────────────────────────────────────
    - name: Apply SukiSU 4.4 Compat Fixes
      working-directory: kernel_source
      run: python3 ${{ env.PATCHES }}/sukisu_compat_fix.py

    # ── 6.6 Apply Manual KSU Hooks ─────────────────────────────────────────────
    - name: Apply Manual KSU Hooks
      working-directory: kernel_source
      run: python3 ${{ env.PATCHES }}/manual_hooks.py

    # ── 7. Kernel Config ───────────────────────────────────────────────────────
    - name: Set Kernel Config
      working-directory: kernel_source
      run: |
        cat >> arch/arm64/configs/n950x_defconfig << 'EOF'
        # SukiSU-Ultra
        CONFIG_KSU=y
        CONFIG_KALLSYMS_ALL=y
        # Disable Samsung security — required for syscall table patching
        CONFIG_UH=n
        CONFIG_UH_RKP=n
        CONFIG_UH_LKMAUTH=n
        CONFIG_UH_LKM_BLOCK=n
        CONFIG_RKP_CFP_JOPP=n
        CONFIG_RKP_CFP=n
        CONFIG_SECURITY_DEFEX=n
        CONFIG_PROCA=n
        CONFIG_FIVE=n
        CONFIG_RKP=n
        CONFIG_KDP_NS=n
        CONFIG_KDP=n
        EOF
        echo "✅ n950x_defconfig updated"

    # ── 8. Build ───────────────────────────────────────────────────────────────
    - name: Build Kernel
      working-directory: kernel_source
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=${{ env.CROSS_COMPILE }}

        ARCH=arm64 scripts/kconfig/merge_config.sh \
          arch/arm64/configs/g950x_defconfig \
          arch/arm64/configs/n950x_defconfig

        grep "CONFIG_KSU=y" .config \
          && echo "✅ CONFIG_KSU=y in final config" \
          || echo "⚠️  CONFIG_KSU not in final config"

        make -j$(nproc) ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE 2>&1 | tee build.log || true

    # ── 9. Grab Image ──────────────────────────────────────────────────────────
    - name: Grab Kernel Image
      if: always()
      id: package
      run: |
        IMAGE="kernel_source/arch/arm64/boot/Image"
        if [ -f "$IMAGE" ]; then
          echo "✅ Image: $(du -h $IMAGE | cut -f1)"
          echo "image=$IMAGE"      >> $GITHUB_OUTPUT
          echo "image_found=true"  >> $GITHUB_OUTPUT
        else
          echo "❌ Image not found — check build.log artifact"
          echo "image_found=false" >> $GITHUB_OUTPUT
        fi

    - name: Upload to GoFile
      if: always() && steps.package.outputs.image_found == 'true'
      run: |
        SERVER=$(curl -s https://api.gofile.io/servers | \
          python3 -c "import sys,json; d=json.load(sys.stdin); \
                      print(d['data']['servers'][0]['name'])")
        RESP=$(curl -s \
          -F "file=@${{ steps.package.outputs.image }}" \
          "https://$SERVER.gofile.io/uploadFile")
        echo "✅ Image → $(echo $RESP | python3 -c \
          "import sys,json; d=json.load(sys.stdin); \
           print(d['data']['downloadPage'])")"

    - name: Upload Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Note8-SukiSU-Ultra
        path: |
          ${{ steps.package.outputs.image }}
          kernel_source/build.log
        if-no-files-found: ignore
        compression-level: 0

    # ── 10. Surface Build Errors ───────────────────────────────────────────────
    - name: Surface Build Errors
      if: always()
      run: |
        if [ ! -f kernel_source/build.log ]; then
          echo "No build log found"
          exit 0
        fi
        ERRORS=$(grep -c "error:" kernel_source/build.log 2>/dev/null || echo 0)
        echo "=== $ERRORS error(s) found ==="
        grep "error:" kernel_source/build.log | head -60 || true
        echo ""
        echo "=== First 10 warnings ==="
        grep "warning:" kernel_source/build.log | head -10 || true
