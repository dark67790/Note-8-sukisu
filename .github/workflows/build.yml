name: Build Note8 Kernel (ReSukiSU + SUSFS)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

jobs:
  build:
    name: SM-N950F · ReSukiSU + SUSFS · Note 8
    runs-on: ubuntu-latest

    steps:
    # ── 1. Checkout ────────────────────────────────────────────────────────────
    - name: Checkout
      uses: actions/checkout@v4

    # ── 2. Dependencies ────────────────────────────────────────────────────────
    - name: Install Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          bc bison flex libssl-dev libelf-dev \
          python3 git patch coreutils curl \
          build-essential cpio wget zip \
          libc6-i386 lib32stdc++6 lib32z1

    # ── 3. Clone Kernel Source ─────────────────────────────────────────────────
    - name: Clone Kernel Source
      run: |
        git clone --depth=1 https://github.com/ace2nutzer/Samsung_dreamlte_Kernel \
          kernel_source

    # ── 4. Download Toolchain ──────────────────────────────────────────────────
    - name: Download Toolchain
      run: |
        wget -q https://developer.arm.com/-/media/Files/downloads/gnu-a/8.3-2019.03/binrel/gcc-arm-8.3-2019.03-x86_64-aarch64-linux-gnu.tar.xz
        tar -xf gcc-arm-8.3-2019.03-x86_64-aarch64-linux-gnu.tar.xz
        rm gcc-arm-8.3-2019.03-x86_64-aarch64-linux-gnu.tar.xz
        echo "✅ ARM GCC 8.3 toolchain ready"

    # ── 5. Environment Variables ───────────────────────────────────────────────
    - name: Set Environment Variables
      run: |
        TC=$GITHUB_WORKSPACE/gcc-arm-8.3-2019.03-x86_64-aarch64-linux-gnu/bin
        echo "KROOT=$GITHUB_WORKSPACE/kernel_source"  >> $GITHUB_ENV
        echo "CROSS_COMPILE=$TC/aarch64-linux-gnu-"   >> $GITHUB_ENV
        echo "PATCHES=$GITHUB_WORKSPACE/patches"      >> $GITHUB_ENV

    # ── 6. Setup ReSukiSU ──────────────────────────────────────────────────────
    - name: Setup ReSukiSU
      working-directory: kernel_source
      run: |
        curl -LSs \
          "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
          | bash -s main || true

        echo "=== Kconfig default BEFORE modifications ==="
        grep -n "default KSU" drivers/kernelsu/Kconfig

        # Update default hook choice to SUSFS
        sed -i 's/default KSU_TRACEPOINT_HOOK/default KSU_SUSFS/' \
          drivers/kernelsu/Kconfig

        # Remove THREAD_INFO_IN_TASK dep from KSU_SUSFS — 4.4 doesn't have it
        sed -i '/depends on THREAD_INFO_IN_TASK/d' drivers/kernelsu/Kconfig
        echo "✅ Removed THREAD_INFO_IN_TASK dep"

        echo "=== Kconfig default AFTER modifications ==="
        grep -n "THREAD_INFO_IN_TASK\|default KSU" drivers/kernelsu/Kconfig

        echo "✅ ReSukiSU default hook → SUSFS"
        FAIL=0
        grep -q "config KSU" drivers/kernelsu/Kconfig \
          && echo "✅ Kconfig has KSU" || { echo "❌ Kconfig missing KSU"; FAIL=1; }
        grep -q "kernelsu" drivers/Makefile \
          && echo "✅ Makefile wired"  || { echo "❌ Makefile not wired";  FAIL=1; }
        [ -d drivers/kernelsu ] \
          && echo "✅ driver dir exists" || { echo "❌ driver dir missing"; FAIL=1; }
        if [ "$FAIL" -ne 0 ]; then
          echo "❌ ReSukiSU setup failed"
          exit 1
        fi

    # ── 7. Apply ReSukiSU 4.4 Compat Fixes ────────────────────────────────────
    - name: Apply ReSukiSU 4.4 Compat Fixes
      working-directory: kernel_source
      run: python3 ${{ env.PATCHES }}/sukisu_compat_fix.py

    # ── 8. Apply Manual KSU Hooks ─────────────────────────────────────────────
    - name: Apply Manual KSU Hooks
      working-directory: kernel_source
      run: python3 ${{ env.PATCHES }}/manual_hooks.py

    # ── 9. Apply SUSFS Patches ────────────────────────────────────────────────
    - name: Apply SUSFS Patches
      working-directory: kernel_source
      run: |
        # Corrected back to kernel-4.9 so downloads complete without 404 errors
        SUSFS_BASE="https://gitlab.com/simonpunk/susfs4ksu/-/raw/kernel-4.9/kernel_patches"
        mkdir -p /tmp/susfs_patches

        echo "⬇️  Fetching 50_add_susfs_in_kernel-4.9.patch"
        wget -q "$SUSFS_BASE/50_add_susfs_in_kernel-4.9.patch" \
          -O /tmp/susfs_patches/susfs.patch \
          && echo "✅ susfs.patch" || echo "⚠️  susfs.patch not found"

        echo "⬇️  Fetching susfs.c"
        wget -q "$SUSFS_BASE/fs/susfs.c" -O fs/susfs.c \
          && echo "✅ susfs.c" || echo "⚠️  susfs.c not found"

        echo "⬇️  Fetching susfs.h"
        wget -q "$SUSFS_BASE/include/linux/susfs.h" -O include/linux/susfs.h \
          && echo "✅ susfs.h" || echo "⚠️  susfs.h not found"

        echo "⬇️  Fetching susfs_def.h"
        wget -q "$SUSFS_BASE/include/linux/susfs_def.h" -O include/linux/susfs_def.h \
          && echo "✅ susfs_def.h" || echo "⚠️  susfs_def.h not found"

        if [ -f /tmp/susfs_patches/susfs.patch ]; then
          SIZE=$(wc -c < /tmp/susfs_patches/susfs.patch)
          if [ "$SIZE" -lt 1024 ]; then
            echo "❌ susfs.patch too small (${SIZE} bytes) — likely 404"
            exit 1
          fi
          echo "=== Applying susfs.patch (${SIZE} bytes) ==="
          patch -p1 \
            --reject-file=/tmp/susfs.patch.rej \
            --no-backup-if-mismatch \
            < /tmp/susfs_patches/susfs.patch \
            && echo "✅ susfs.patch applied clean" \
            || echo "⚠️  susfs.patch had rejects — fixing in next step"
        else
          echo "❌ susfs.patch not found"
          exit 1
        fi

        echo ""
        echo "=== Reject summary ==="
        find /tmp -name "*.rej" 2>/dev/null | while read r; do
          echo "--- $r ---"
          cat "$r"
          echo ""
        done || echo "No rejects"

    # ── 10. Apply SUSFS 4.4 Samsung Fixups ────────────────────────────────────
    - name: Apply SUSFS 4.4 Samsung Fixups
      working-directory: kernel_source
      run: python3 ${{ env.PATCHES }}/susfs_hunk_fix_note8.py

    # ── 11. Kernel Config ──────────────────────────────────────────────────────
    - name: Set Kernel Config
      working-directory: kernel_source
      run: |
        sed -i 's/int selinux_enforcing = 0;/int selinux_enforcing = 1;/g' \
          security/selinux/hooks.c
        echo "✅ Patched hooks.c to Enforcing"

        cat >> arch/arm64/configs/n950x_defconfig << 'EOF'
        CONFIG_KSU=y
        CONFIG_KALLSYMS_ALL=y
        CONFIG_UH=n
        CONFIG_UH_RKP=n
        CONFIG_UH_LKMAUTH=n
        CONFIG_UH_LKM_BLOCK=n
        CONFIG_RKP_CFP_JOPP=n
        CONFIG_RKP_CFP=n
        CONFIG_SECURITY_DEFEX=n
        CONFIG_PROCA=n
        CONFIG_FIVE=n
        CONFIG_RKP=n
        CONFIG_KDP_NS=n
        CONFIG_KDP=n
        CONFIG_KSU_SUSFS=y
        CONFIG_KSU_SUSFS_SUS_PATH=y
        CONFIG_KSU_SUSFS_SUS_MOUNT=y
        CONFIG_KSU_SUSFS_SUS_KSTAT=y
        CONFIG_KSU_SUSFS_TRY_UMOUNT=y
        CONFIG_KSU_SUSFS_SPOOF_UNAME=y
        CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
        CONFIG_KSU_SUSFS_ENABLE_LOG=y
        CONFIG_KSU_SUSFS_SUS_SU=n
        CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
        CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
        CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
        CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=n
        EOF
        # Strip yaml heredoc indentation — merge_config.sh needs ^CONFIG_ lines
        sed -i 's/^[[:space:]]*\(CONFIG_\)/\1/' arch/arm64/configs/n950x_defconfig
        echo "✅ n950x_defconfig updated"

    # ── 12. Build ──────────────────────────────────────────────────────────────
    - name: Build Kernel
      working-directory: kernel_source
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=${{ env.CROSS_COMPILE }}
        ARCH=arm64 scripts/kconfig/merge_config.sh \
          arch/arm64/configs/g950x_defconfig \
          arch/arm64/configs/n950x_defconfig

        # Remove conflicting hook entries entirely — let KSU_SUSFS be the only one
        sed -i '/CONFIG_KSU_TRACEPOINT_HOOK\|CONFIG_KSU_MANUAL_HOOK/d' .config
        echo "✅ Cleared hook choice conflicts from .config"

        # Force all KSU + SUSFS configs into .config
        for cfg in \
          CONFIG_KSU_SUSFS \
          CONFIG_KSU_SUSFS_SUS_PATH \
          CONFIG_KSU_SUSFS_SUS_MOUNT \
          CONFIG_KSU_SUSFS_SUS_KSTAT \
          CONFIG_KSU_SUSFS_TRY_UMOUNT \
          CONFIG_KSU_SUSFS_SPOOF_UNAME \
          CONFIG_KSU_SUSFS_OPEN_REDIRECT \
          CONFIG_KSU_SUSFS_ENABLE_LOG \
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT; do
          sed -i "s/# ${cfg} is not set/${cfg}=y/" .config
          grep -q "^${cfg}=y" .config || echo "${cfg}=y" >> .config
        done
        
        # Explicit disables
        for cfg in \
          CONFIG_KSU_MANUAL_HOOK \
          CONFIG_KSU_TRACEPOINT_HOOK \
          CONFIG_KSU_SUSFS_SUS_SU \
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG; do
          sed -i "s/^${cfg}=y/# ${cfg} is not set/" .config
          grep -q "^${cfg}" .config || echo "# ${cfg} is not set" >> .config
        done

        grep "CONFIG_KSU_SUSFS=y" .config \
          && echo "✅ CONFIG_KSU_SUSFS=y confirmed" \
          || echo "⚠️  CONFIG_KSU_SUSFS not set"

        # Let Kconfig properly process the choice with our values
        make ARCH=arm64 olddefconfig 2>&1 | grep -E "KSU|warning|error" || true

        echo "=== Hook choice in .config after olddefconfig ==="
        grep -E "CONFIG_KSU_SUSFS=|CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_TRACEPOINT" .config \
          | grep -v "_SUS_PATH\|_SUS_MOUNT\|_SUS_KSTAT\|_TRY_\|_SPOOF\|_ENABLE\|_AUTO\|_OPEN\|_SUS_SU"

        make -j$(nproc) ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE 2>&1 | tee build.log || true

    # ── 13. Grab Image ─────────────────────────────────────────────────────────
    - name: Grab Kernel Image
      if: always()
      id: package
      run: |
        IMAGE="kernel_source/arch/arm64/boot/Image"
        if [ -f "$IMAGE" ]; then
          echo "✅ Image: $(du -h $IMAGE | cut -f1)"
          echo "image=$IMAGE"      >> $GITHUB_OUTPUT
          echo "image_found=true"  >> $GITHUB_OUTPUT
        else
          echo "❌ Image not found — check build.log"
          echo "image_found=false" >> $GITHUB_OUTPUT
        fi

    - name: Upload to GoFile
      if: always() && steps.package.outputs.image_found == 'true'
      run: |
        SERVER=$(curl -s https://api.gofile.io/servers | \
          python3 -c "import sys,json; d=json.load(sys.stdin); \
                      print(d['data']['servers'][0]['name'])")
        RESP=$(curl -s \
          -F "file=@${{ steps.package.outputs.image }}" \
          "https://$SERVER.gofile.io/uploadFile")
        echo "✅ Image → $(echo $RESP | python3 -c \
          "import sys,json; d=json.load(sys.stdin); \
           print(d['data']['downloadPage'])")"

    - name: Upload Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Note8-ReSukiSU-SUSFS
        path: |
          ${{ steps.package.outputs.image }}
          kernel_source/build.log
        if-no-files-found: ignore
        compression-level: 0

    # ── 14. Surface Build Errors ───────────────────────────────────────────────
    - name: Surface Build Errors
      if: always()
      run: |
        if [ ! -f kernel_source/build.log ]; then
          echo "No build log found"
          exit 0
        fi
        echo "=== SUSFS errors ==="
        grep -nE "susfs\|sus_path\|sus_mount\|sus_kstat" kernel_source/build.log \
          | grep -E "error:|Error [0-9]+|\*\*\*" | head -30 || true
        echo ""
        echo "=== KSU driver errors ==="
        grep -nE "kernelsu\|drivers/kernelsu" kernel_source/build.log \
          | grep -E "error:|Error [0-9]+|\*\*\*" | head -30 || true
        echo ""
        echo "=== All errors ==="
        ERRORS=$(grep -cE "error:|Error [0-9]+|\*\*\*" kernel_source/build.log 2>/dev/null || echo 0)
        echo "$ERRORS error(s) found"
        grep -E "error:|Error [0-9]+|\*\*\*" kernel_source/build.log | head -60 || true
        echo ""
        echo "=== Warnings (first 10) ==="
        grep "warning:" kernel_source/build.log | head -10 || true
        echo ""
        echo "=== SUSFS rejects ==="
        find /tmp -name "*.rej" 2>/dev/null | while read r; do
          echo "--- $r ---"
          cat "$r"
        done || true
